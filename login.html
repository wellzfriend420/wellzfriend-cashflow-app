<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ログイン | ウェルノット資金繰り</title><link rel="stylesheet" href="/assets/styles.css"></head>
<body><main class="login-panel card"><div class="card-header">ウェルノット資金繰り</div><form id="loginForm" class="section">
<h1 style="font-size:20px;margin-bottom:20px">ログイン</h1>
<div class="form-group"><label class="form-label" for="username">ユーザー名</label><input id="username" class="form-input" autocomplete="username" required maxlength="40"></div>
<div class="form-group"><label class="form-label" for="password">パスワード</label><input id="password" class="form-input" type="password" autocomplete="current-password" required maxlength="256"></div>
<p id="loginError" role="alert" style="color:#b42318;margin:12px 0"></p><button class="btn btn-primary w-full" type="submit">ログイン</button>
</form></main><script src="/assets/login.js"></script></body></html>
